server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: customers-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trato_clientes_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app.security:
  jwt-secret: ${JWT_SECRET:DEV_ONLY_CHANGE_THIS_SECRET_TO_A_LONG_RANDOM_VALUE_AT_LEAST_64_CHARS}
