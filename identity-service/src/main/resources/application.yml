server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trato_identidad_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  security:
    jwt-secret: ${JWT_SECRET:DEV_ONLY_CHANGE_THIS_SECRET_TO_A_LONG_RANDOM_VALUE_AT_LEAST_64_CHARS}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:14}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    tenant-name: ${BOOTSTRAP_TENANT_NAME:Empresa Demo}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:Administrador Demo}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@tratohecho.cl}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
