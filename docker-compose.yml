services:
  mysql:
    image: mysql:8.4
    container_name: tratohecho-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - tratohecho_mysql_data:/var/lib/mysql
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15

  identity-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE_NAME: identity-service }
    container_name: tratohecho-identity
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/trato_identidad_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-false}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Empresa Demo}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador Demo}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@tratohecho.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["8081:8081"]

  customers-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE_NAME: customers-service }
    container_name: tratohecho-customers
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/trato_clientes_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["8082:8082"]

  commercial-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE_NAME: commercial-service }
    container_name: tratohecho-commercial
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/trato_comercial_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CUSTOMERS_SERVICE_URL: http://customers-service:8082
    depends_on:
      mysql: { condition: service_healthy }
      customers-service: { condition: service_started }
    ports: ["8083:8083"]

  billing-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { SERVICE_NAME: billing-service }
    container_name: tratohecho-billing
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:mysql://mysql:3306/trato_facturacion_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COMMERCIAL_SERVICE_URL: http://commercial-service:8083
    depends_on:
      mysql: { condition: service_healthy }
      commercial-service: { condition: service_started }
    ports: ["8084:8084"]

volumes:
  tratohecho_mysql_data:
