server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: commercial-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trato_comercial_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app.security:
  jwt-secret: ${JWT_SECRET:DEV_ONLY_CHANGE_THIS_SECRET_TO_A_LONG_RANDOM_VALUE_AT_LEAST_64_CHARS}
services.customers.base-url: ${CUSTOMERS_SERVICE_URL:http://localhost:8082}
